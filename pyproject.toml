[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "auto_pricing"
version = "0.1.0"
description = "Frequency-severity auto insurance pricing engine (RiskRate)"
requires-python = ">=3.11"
readme = "README.md"
dependencies = [
    "pandas==3.0.6",
    "numpy==2.5.3",
    "matplotlib==3.11.2",
    "scikit-learn==1.9.1",
    "statsmodels==0.15.0",
    "pyarrow==25.0.1",
    "openpyxl==3.1.5",
    "streamlit==1.64.0",
    "boto3==1.43.105",
]

[project.optional-dependencies]
notebook = [
    "jupyter==1.1.1",
    "notebook==7.6.3",
    "ipykernel==7.3.0",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.setuptools.packages.find]
where = ["src"]
